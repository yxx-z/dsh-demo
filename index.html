<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1014" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="一个轻量、无需登录、离线可用的待办清单，适配手机与桌面。"
    />
    <title>待办清单</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="app" aria-labelledby="app-title">
        <header class="app__header">
          <div>
            <p class="app__eyebrow" id="today"></p>
            <h1 class="app__title" id="app-title">待办清单</h1>
          </div>
          <span class="app__badge" id="remaining-badge" aria-hidden="true">0</span>
        </header>

        <form class="add-form" id="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">添加一项待办</label>
          <input
            class="add-form__input"
            id="todo-input"
            name="todo"
            type="text"
            maxlength="200"
            placeholder="添加一项待办…"
            enterkeyhint="done"
          />
          <button class="add-form__button" type="submit" aria-label="添加待办">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </form>

        <div class="filters" role="group" aria-label="筛选待办">
          <button
            class="filters__btn is-active"
            type="button"
            data-filter="all"
            aria-pressed="true"
          >
            全部
          </button>
          <button class="filters__btn" type="button" data-filter="active" aria-pressed="false">
            进行中
          </button>
          <button class="filters__btn" type="button" data-filter="completed" aria-pressed="false">
            已完成
          </button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="empty" id="empty" hidden>
          <div class="empty__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
              <path
                d="m8.5 12.2 2.4 2.4 4.6-5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <p class="empty__title" id="empty-title">还没有待办</p>
          <p class="empty__hint" id="empty-hint">在上方输入框写下第一件事吧</p>
        </div>

        <footer class="app__footer">
          <p class="remaining" id="remaining" aria-live="polite">剩余 0 项</p>
          <button class="link-btn" id="clear-completed" type="button" disabled>
            清除已完成
          </button>
        </footer>
      </section>

      <p class="tip">数据保存在此设备的浏览器中 · 离线可用</p>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <button class="todo-check" type="button" role="checkbox" aria-checked="false"></button>
        <span class="todo-text"></span>
        <button class="todo-delete" type="button" aria-label="删除">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
